author: "Absolucy"
delete-after: True
changes:
  - rscadd: "You can now right-click a meteor sat capsule in your hand, or right click a meteor sat capsule with a multitool, to view a HUD previewing meteor sat coverage!"
  - rscadd: "This preview shows what's already covered by other active meteor sats (blue), what spots are solely covered by the current sat (green), and what spots are obscured due to walls or such (red)."